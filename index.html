<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ROCK PAPER SCISSORS</h1>
    <div class="scoreDiv">
        <div class="pScore">
            <p>PLAYER:</p>
            <p class="pScoreText">0</p>
        </div>
        <div class="cScore">
            <p>COMPUTER:</p>
            <p class="cScoreText">0</p>
        </div>
    </div>
    <div class="container">
        <button class="action" id="rock">ROCK</button>
        <button class="action" id="paper">PAPER</button>
        <button class="action" id="scissors">SCISSORS</button>
    </div>
    <div class="resultsDiv">
        <h2 class="message">CHOOSE YOUR WEAPON!</h2>
        <button class="reset">RESET GAME</button>
    </div>
    <script src="javaScript.js"></script>  
</body>
</html>
