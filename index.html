<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
    <h1>ROCK PAPER SCISSORS</h1>
    <div class="scoreDiv">
        <div class="pScore">
            <p>PLAYER:</p>
            <p class="pScoreText">0</p>
        </div>
        <div class="cScore">
            <p>COMPUTER:</p>
            <p class="cScoreText">0</p>
        </div>
    </div>
    <div class="container">
        <button class="action" id="rock">
            <img src="hand-fist-solid-full.svg" alt="Fist hand gesture(rock)">
            </button>
        <button class="action" id="paper">
            <img src="hand-solid-full.svg" alt="Hand palm gesture(paper)">
        </button>
        <button class="action" id="scissors">
            <img src="hand-scissors-solid-full.svg" alt="Scissors hand gesture(scissors)">
        </button>
    </div>
    <div class="resultsDiv">
        <h2 class="message">CHOOSE YOUR WEAPON!</h2>
        <button class="reset">RESET GAME</button>
    </div>
    </main>
    <script src="javaScript.js"></script>  
</body>
</html>
